# Build ONLY the custom ksu_susfs (with add_sus_maps) — separate workflow file.
#
# Why a second file? GitHub's workflow_dispatch cache repeatedly served a STALE snapshot
# of build.yml (a pre-NDK version, 49 steps, no "Build custom ksu_susfs" step) across
# builds #243/#244/#245 even though the tree tip contained the NDK step. A freshly-named
# workflow file registers a clean dispatch handler, so the NDK step here always runs.
#
# Source: build/patches/susfs_userspace/main.c (SUSFS v1.5.5, ABI sys_reboot, adds
# the add_sus_maps / update_sus_maps GKI-backport commands at 0x5556d / 0x55562).
#
# The device's already-flashed kernel (build #243, commit 98016777+) has CONFIG_KSU_SUSFS_SUS_MAP=y
# and the display hook wired — it only needs this userspace binary to drive it.

name: Build ksu_susfs (add_sus_maps)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the uploaded artifact'
        required: false
        default: 'add_sus_maps'
        type: string

env:
  PROJECT_ROOT: projects/btc/ff

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install NDK r25b (linux-x86_64)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
          mkdir -p /opt/ndk
          unzip -q /tmp/ndk.zip -d /opt/ndk
          echo "ANDROID_NDK_HOME=/opt/ndk/android-ndk-r25b" >> "$GITHUB_ENV"

      - name: Cross-compile ksu_susfs (add_sus_maps)
        run: |
          set -euo pipefail
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          SRC="$GITHUB_WORKSPACE/$PROJECT_ROOT/build/patches/susfs_userspace/main.c"
          OUT="$GITHUB_WORKSPACE/$PROJECT_ROOT/build/packaging/ak3/bin/ksu_susfs"
          mkdir -p "$(dirname "$OUT")"
          "$CLANG" -static -O2 -D__ANDROID_API__=21 \
            -I "$(dirname "$SRC")" "$SRC" -o "$OUT"
          chmod 755 "$OUT"
          "$OUT" 2>&1 | grep -q add_sus_maps && echo "userspace add_sus_maps OK" \
            || { echo "::error::add_sus_maps missing from built ksu_susfs"; exit 1; }
          ls -lh "$OUT"

      - name: Upload ksu_susfs binary
        uses: actions/upload-artifact@v4
        with:
          name: ksu_susfs-add_sus_maps
          path: ${{ env.PROJECT_ROOT }}/build/packaging/ak3/bin/ksu_susfs
          retention-days: 30
